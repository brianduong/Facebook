<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3F8065"/>
      <stop offset="100%" stop-color="#2E5D4B"/>
    </radialGradient>
    <linearGradient id="leafA" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#EAF5E8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8DC38A"/>
      <stop offset="100%" stop-color="#B7DEB2"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0E2A1F" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Nền tròn -->
  <circle cx="540" cy="540" r="540" fill="url(#bg)"/>
  <circle cx="540" cy="540" r="484" fill="none" stroke="#7BAE7F" stroke-width="5" opacity="0.45"/>

  <!-- MẦM CÂY -->
  <g filter="url(#soft)">
    <!-- Thân mầm cong nhẹ -->
    <path d="M540,690 C 528,600 528,560 540,505" fill="none" stroke="#6FAF72" stroke-width="16" stroke-linecap="round"/>

    <!-- Lá trái -->
    <g transform="translate(540 512) rotate(-30)">
      <path d="M0,0 C -60,-55 -60,-150 0,-206 C 60,-150 60,-55 0,0 Z" fill="url(#leafA)"/>
      <path d="M0,-8 C -6,-70 -6,-140 0,-196" fill="none" stroke="#CFE6CB" stroke-width="5" opacity="0.7"/>
    </g>
    <!-- Lá phải -->
    <g transform="translate(540 512) rotate(30)">
      <path d="M0,0 C -60,-55 -60,-150 0,-206 C 60,-150 60,-55 0,0 Z" fill="url(#leafB)"/>
      <path d="M0,-8 C -6,-70 -6,-140 0,-196" fill="none" stroke="#5E9E74" stroke-width="5" opacity="0.6"/>
    </g>

    <!-- Giọt sương nhấn vàng -->
    <circle cx="600" cy="470" r="12" fill="#E9C46A"/>
  </g>

  <!-- Tên thương hiệu -->
  <text x="540" y="812" text-anchor="middle"
        font-family="'Be Vietnam Pro','Montserrat','Segoe UI',Arial,sans-serif"
        font-size="152" font-weight="800" fill="#F7FAF5" letter-spacing="1">Sống Tốt</text>
  <text x="540" y="890" text-anchor="middle"
        font-family="'Be Vietnam Pro','Montserrat','Segoe UI',Arial,sans-serif"
        font-size="42" font-weight="500" fill="#E9C46A" letter-spacing="11">MỖI NGÀY MỘT ĐIỀU TỐT LÀNH</text>
</svg>
