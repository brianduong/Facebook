<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#3C7A62"/>
      <stop offset="100%" stop-color="#2E5D4B"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#12332699" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Nền tròn (Facebook cắt tròn) -->
  <circle cx="540" cy="540" r="540" fill="url(#bg)"/>
  <circle cx="540" cy="540" r="486" fill="none" stroke="#7BAE7F" stroke-width="6" opacity="0.5"/>

  <!-- Mầm cây: hai lá + giọt (biểu tượng sinh trưởng, tử tế) -->
  <g filter="url(#soft)" transform="translate(540 452)">
    <!-- Lá trái -->
    <path d="M0,120 C -95,60 -95,-150 -14,-232 C -6,-190 -18,-70 0,120 Z"
          fill="#F7FAF5" transform="rotate(-16)"/>
    <!-- Lá phải -->
    <path d="M0,120 C 95,60 95,-150 14,-232 C 6,-190 18,-70 0,120 Z"
          fill="#A9D4A6" transform="rotate(16)"/>
    <!-- Thân mầm -->
    <path d="M0,150 C -6,60 -6,20 0,-40 C 6,20 6,60 0,150 Z" fill="#E9C46A"/>
  </g>

  <!-- Tên thương hiệu -->
  <text x="540" y="812" text-anchor="middle"
        font-family="'Be Vietnam Pro','Montserrat','Segoe UI',Arial,sans-serif"
        font-size="150" font-weight="800" fill="#F7FAF5" letter-spacing="2">Sống Tốt</text>
  <text x="540" y="892" text-anchor="middle"
        font-family="'Be Vietnam Pro','Montserrat','Segoe UI',Arial,sans-serif"
        font-size="44" font-weight="500" fill="#E9C46A" letter-spacing="10">MỖI NGÀY MỘT ĐIỀU TỐT LÀNH</text>
</svg>
