<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="856" viewBox="0 0 1640 856">
  <defs>
    <linearGradient id="cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E5D4B"/>
      <stop offset="55%" stop-color="#3C7A62"/>
      <stop offset="100%" stop-color="#5E9E74"/>
    </linearGradient>
    <filter id="softb" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#123326" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1640" height="856" fill="url(#cover)"/>

  <!-- Lá trang trí mờ ở góc -->
  <g opacity="0.12" fill="#F7FAF5">
    <path d="M1640,0 C 1420,60 1320,300 1400,520 C 1540,420 1640,240 1640,60 Z"/>
    <path d="M0,856 C 220,796 320,556 240,336 C 100,436 0,616 0,796 Z"/>
  </g>

  <!-- Đường bo trang trí -->
  <circle cx="1300" cy="700" r="240" fill="none" stroke="#7BAE7F" stroke-width="3" opacity="0.35"/>
  <circle cx="270" cy="140" r="150" fill="none" stroke="#A9D4A6" stroke-width="3" opacity="0.3"/>

  <!-- VÙNG AN TOÀN: chữ đặt giữa để không bị avatar/nút che -->
  <g transform="translate(560 300)">
    <!-- Mầm nhỏ -->
    <g filter="url(#softb)" transform="translate(-70 60) scale(0.9)">
      <path d="M0,60 C -48,30 -48,-75 -7,-116 C -3,-95 -9,-35 0,60 Z" fill="#F7FAF5" transform="rotate(-16)"/>
      <path d="M0,60 C 48,30 48,-75 7,-116 C 3,-95 9,-35 0,60 Z" fill="#A9D4A6" transform="rotate(16)"/>
      <path d="M0,75 C -3,30 -3,10 0,-20 C 3,10 3,30 0,75 Z" fill="#E9C46A"/>
    </g>

    <text x="60" y="10"
          font-family="'Be Vietnam Pro','Montserrat','Segoe UI',Arial,sans-serif"
          font-size="128" font-weight="800" fill="#F7FAF5">Sống Tốt</text>
    <text x="64" y="90"
          font-family="'Be Vietnam Pro','Montserrat','Segoe UI',Arial,sans-serif"
          font-size="46" font-weight="500" fill="#E9C46A" letter-spacing="6">Lan toả điều tử tế mỗi ngày 🌱</text>
  </g>

  <!-- Gợi ý vùng bị che (avatar bên trái, nút bên phải) - CHỈ để tham khảo, xoá khi xuất bản -->
</svg>
