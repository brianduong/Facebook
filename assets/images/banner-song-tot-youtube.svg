<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <!--
    Banner YouTube cho kênh Sống Tốt. Khác bản Facebook (1640×856) ở khổ và ở vùng
    an toàn: YouTube cắt rất khác nhau theo thiết bị, trên điện thoại chỉ còn dải giữa
    1546×423 (x 507→2053, y 508→932). Mọi chữ và hình đều nằm trong dải đó.

    Cùng bố cục với banner One Small Thing để hai kênh nhìn ra là một tay làm — khác
    ở nền xanh lá và ở mầm cây thay cho ba chấm.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3F8065"/>
      <stop offset="55%" stop-color="#2E5D4B"/>
      <stop offset="100%" stop-color="#16382A"/>
    </linearGradient>
    <linearGradient id="leafA" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#EAF5E8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8DC38A"/>
      <stop offset="100%" stop-color="#B7DEB2"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0E2A1F" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="2560" height="1440" fill="url(#bg)"/>

  <!-- Vòng tròn mờ ngoài dải an toàn — chỉ thấy trên TV và máy tính -->
  <circle cx="330" cy="330" r="300" fill="none" stroke="#A9D4A6" stroke-width="3" opacity="0.12"/>
  <circle cx="2270" cy="1160" r="380" fill="none" stroke="#A9D4A6" stroke-width="3" opacity="0.12"/>
  <circle cx="2330" cy="290" r="170" fill="none" stroke="#A9D4A6" stroke-width="3" opacity="0.09"/>

  <!-- ===== DẢI AN TOÀN ===== -->

  <!-- Mầm cây, lấy từ icon-song-tot.svg, thu nhỏ 0.28 -->
  <g filter="url(#soft)" transform="translate(1128.8 459.3) scale(0.28)">
    <path d="M540,690 C 528,600 528,560 540,505" fill="none" stroke="#6FAF72"
          stroke-width="16" stroke-linecap="round"/>
    <g transform="translate(540 512) rotate(-30)">
      <path d="M0,0 C -60,-55 -60,-150 0,-206 C 60,-150 60,-55 0,0 Z" fill="url(#leafA)"/>
      <path d="M0,-8 C -6,-70 -6,-140 0,-196" fill="none" stroke="#CFE6CB" stroke-width="5" opacity="0.7"/>
    </g>
    <g transform="translate(540 512) rotate(30)">
      <path d="M0,0 C -60,-55 -60,-150 0,-206 C 60,-150 60,-55 0,0 Z" fill="url(#leafB)"/>
      <path d="M0,-8 C -6,-70 -6,-140 0,-196" fill="none" stroke="#5E9E74" stroke-width="5" opacity="0.6"/>
    </g>
    <circle cx="600" cy="470" r="12" fill="#E9C46A"/>
  </g>

  <text x="1280" y="808" text-anchor="middle"
        font-family="'Be Vietnam Pro','Montserrat','Segoe UI',Arial,sans-serif"
        font-size="140" font-weight="800" fill="#F7FAF5" letter-spacing="2">Sống Tốt</text>

  <text x="1280" y="884" text-anchor="middle"
        font-family="'Be Vietnam Pro','Montserrat','Segoe UI',Arial,sans-serif"
        font-size="40" font-weight="500" fill="#E9C46A" letter-spacing="11">MỖI NGÀY MỘT ĐIỀU TỐT LÀNH</text>
</svg>
