<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E5D4B"/>
      <stop offset="100%" stop-color="#7BAE7F"/>
    </linearGradient>
    <linearGradient id="fade2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#123326" stop-opacity="0"/>
      <stop offset="100%" stop-color="#123326" stop-opacity="0.68"/>
